  <!-- Row E: meta -->
  <rect x="40" y="1030" width="1520" height="74" rx="14" class="un"/>
  <text x="58" y="1054" class="h">META</text>
  <text x="130" y="1054" class="s">sitemap.xml: / /start /integritet /villkor /login /signup /uppgradera (changefreq monthly) · robots.txt: Allow / ; Disallow /api/ /konto /valkommen /create /reader /voice-test</text>
  <text x="130" y="1074" class="s">Every page: og:title «Tale Forge», og:image /opengraph-image.png 1200×630, twitter summary_large_image. Only 3 routes set their own tab title: Uppgradera/Upgrade, Integritetspolicy/Privacy notice,</text>
  <text x="130" y="1092" class="s">Användarvillkor/Terms of service (+ own descriptions on the legal pages). manifest: standalone, theme/background #171232, start_url /.</text>
