<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <title>Map: dotted trail + lit gradient trail</title>
  <!-- Tale Forge endings-map part. Unlit branches: round-capped dots (dasharray 0.1 8, 1.6 px). Lit route: 2.4 px stroke with a gold -&gt; violet-soft gradient, drawn on via stroke-dashoffset (pathLength 1). Source: assets/svg-inline/home__hiw-map-desktop__d942793a.svg (paths). CSS: source/css/3q17cp_jgfwol.pretty.css:2931-2952. Tokens below are the Natt values; swap in TOKENS from the Morgon theme to re-theme. -->
  <style>
  @font-face { font-family: "Schibsted Grotesk"; src: url(../../../assets/fonts/31a9145ccb84606d-s.p.1_j-vbs-91rji.woff2) format("woff2"); font-weight: 400 800; }
  svg { --dash-line: #ffecbe59; --map-dot: #9b87f5; --map-glow: #f5c54240; --gold-chip-bg: #f2b22e29; --gold-chip-ink: #ffd98f; --gold-soft: #f5c542; --page-sub: #d9cfee; --card-line: #9b87f542; }
  .map-path { stroke: var(--dash-line); fill: none; stroke-width: 1.6px; stroke-dasharray: 0.1 8; stroke-linecap: round; }
  .map-path-lit { stroke-width: 2.4px; fill: none; }
  .map-path-lit--lit { transition: stroke-dashoffset .9s ease-out, opacity .2s; }
  .map-path-lit--fading { transition: opacity .25s; }
  .map-path-lit--off { transition: none; }
  .map-dot { fill: var(--map-dot); }
  .map-dot-halo { fill: var(--map-dot); opacity: .18; }
  .map-choice { fill: var(--gold-chip-bg); stroke: var(--gold-soft); stroke-width: 1.5px; }
  .map-choice-glyph { stroke: var(--gold-chip-ink); stroke-width: 1.6px; stroke-linecap: round; stroke-linejoin: round; }
  .map-choice-label { font-family: "Schibsted Grotesk", "Segoe UI", system-ui, sans-serif; fill: var(--page-sub); font-size: 11px; font-weight: 600; }
  .map-medallion { transform-box: fill-box; transform-origin: 50%; filter: drop-shadow(0 0 18px var(--map-glow)); transition: transform .2s, opacity .2s; }
  .map-medallion-ring { stroke-width: 2px; }
  .map-medallion.is-active { transform: scale(1.05); }
  .map-medallion.is-active .map-medallion-ring { stroke-width: 3px; }
  .map-medallion.is-dimmed { opacity: .55; }
  .map-num-bg { fill: var(--gold-chip-bg); }
  .map-num { font-family: "Schibsted Grotesk", "Segoe UI", system-ui, sans-serif; fill: var(--gold-chip-ink); font-size: 11px; font-weight: 700; }
</style>
  <defs>
    <linearGradient id="lit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5c542"/>
      <stop offset="1" stop-color="#9b87f5"/>
    </linearGradient>
  </defs>
  <path class="map-path" d="M 10 18 L 230 18"/>
  <path class="map-path-lit" d="M 10 44 C 60 44 80 44 230 44" stroke="url(#lit)" opacity="0.9" fill="none"/>
</svg>
