<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>GoHere end card: client row</title>
<style>
  @font-face { font-family: Nunito; font-weight: 600; src: url(fonts/nunito-latin-600-normal.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: Nunito; font-weight: 700; src: url(fonts/nunito-latin-700-normal.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: Nunito; font-weight: 800; src: url(fonts/nunito-latin-800-normal.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: Nunito; font-weight: 900; src: url(fonts/nunito-latin-900-normal.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'Nunito Sans'; font-weight: 600; src: url(fonts/nunito-sans-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Nunito Sans'; font-weight: 700; src: url(fonts/nunito-sans-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Nunito Sans'; font-weight: 800; src: url(fonts/nunito-sans-latin-800-normal.woff2) format('woff2'); }
  html, body { margin: 0; background: #fff; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #fff; }
  /* no will-change: a promoted layer resamples the text and, split across render tabs, makes it tremble */
  .abs { position: absolute; left: 0; top: 0; }
  .label { white-space: nowrap; }
  .item { display: flex; align-items: center; white-space: nowrap; }
  .tile { flex: none; overflow: hidden; background: #fff; }
  .tile img { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
// The film plays at 30 fps; every time below is a frame of the whole film (frame 0 = 0.00 s).
// The original end card's row ("APPS BY" and four apps) started to appear on frame 1017.

const CLIENTS = {
  terschelling:     'Terschelling Tips',
  transavia:        'Transavia Tips',
  ciaotutti:        'Ciao Tutti',
  barcelonatips:    'BarcelonaTips',
  alicante:         'Alicante Like a Local',
  raadsheer:        'Raadsheer',
  malagatips:       'Malaga Tips',
  clubrondreizen:   'Club Rondreizen',
  sevillabymandy:   'Sevilla by Mandy',
  stouteschoenen:   'Stoute schoenen',
  valenciatips:     'Valencia Tips',
  wereldstadgidsen: 'Wereldstadgidsen',
  vakantiexperts:   'VakantieXperts',
  honeyguide:       'Honeyguide',
  freely:           'Freely',
  bcnhacks:         'BCN Hacks',
};
// The four apps the film already showed, then the client's twelve in the order of their email.
const ORDER = ['terschelling', 'transavia', 'ciaotutti', 'barcelonatips',
  'alicante', 'raadsheer', 'malagatips', 'clubrondreizen',
  'sevillabymandy', 'stouteschoenen', 'valenciatips', 'wereldstadgidsen',
  'vakantiexperts', 'honeyguide', 'freely', 'bcnhacks'];

// Measured from the original row (frame 1105) and fitted by calibrate.mjs.
const STYLE = Object.assign({
  nameSize: 22, nameWeight: 800, nameColor: '#14142b', nameTrack: 0,
  labelSize: 20, labelWeight: 800, labelColor: '#4d4c60', labelTrack: 0.18, labelFamily: 'Nunito Sans',
  tile: 55, radius: 13, tileGap: 12.5, itemGap: 37,
  shadow: '0 4px 12px rgba(20, 24, 60, 0.2)',
  nameDy: 0, labelDy: 2,
}, window.STYLE_OVERRIDE || {});

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ramp = (f, a, b) => clamp((f - a) / (b - a));
const smooth = u => u * u * (3 - 2 * u);
// The original row's settle: a long ease-out, (1 - u)^2.2, fitted to its measured drift.
const settle = u => Math.pow(1 - clamp(u), 2.2);
const easeIn = u => u * u;

const stage = document.getElementById('stage');
function el(cls, parent = stage) { const d = document.createElement('div'); d.className = cls; parent.appendChild(d); return d; }

function makeLabel(text) {
  const d = el('abs label');
  d.textContent = text;
  Object.assign(d.style, {
    fontFamily: STYLE.labelFamily, fontWeight: STYLE.labelWeight, fontSize: STYLE.labelSize + 'px',
    letterSpacing: STYLE.labelTrack + 'em', color: STYLE.labelColor, lineHeight: '1',
  });
  return d;
}
function makeItem(slug, withName = true) {
  const d = el('abs item');
  const t = el('tile', d);
  Object.assign(t.style, { width: STYLE.tile + 'px', height: STYLE.tile + 'px', borderRadius: STYLE.radius + 'px', boxShadow: STYLE.shadow });
  const img = document.createElement('img'); img.src = `tiles/${slug}.png`; t.appendChild(img);
  // the film's own four are 55 px cuts from the film: scale them by whole pixels so the supersampled
  // render gives back exactly the film's pixels
  if (ORDER.indexOf(slug) < 4) img.style.imageRendering = 'pixelated';
  if (withName) {
    const n = document.createElement('span');
    n.textContent = CLIENTS[slug];
    Object.assign(n.style, {
      marginLeft: STYLE.tileGap + 'px', fontFamily: 'Nunito', fontWeight: STYLE.nameWeight, fontSize: STYLE.nameSize + 'px',
      color: STYLE.nameColor, letterSpacing: STYLE.nameTrack + 'em', lineHeight: '1', position: 'relative', top: STYLE.nameDy + 'px',
    });
    d.appendChild(n);
  }
  return d;
}
// Positions snap to the render's device-pixel grid (1/SS px; see render.mjs): text and tile stay locked
// together and every frame is the same whichever tab draws it, while the supersampled render glides.
const snap = v => Math.round(v * (window.SS || 1)) / (window.SS || 1);
const place = (d, x, y, o = 1) => { d.style.transform = `translate(${snap(x)}px, ${snap(y)}px)`; d.style.opacity = o; };

// ---------------------------------------------------------------- layouts
let scene = null;

// calib: the original row, rebuilt at its measured place, to fit the type and tiles to the film.
function buildCalib() {
  const label = makeLabel('APPS BY');
  const xs = { terschelling: 222, transavia: 503, ciaotutti: 756, barcelonatips: 959 };
  const items = Object.keys(xs).map(s => makeItem(s));
  return { frame() {
    place(label, 76, STYLE.labelY ?? 830 + STYLE.labelDy, 1);
    items.forEach((it, i) => place(it, Object.values(xs)[i], 813, 1));
  } };
}

// Layout shared by both versions: the label on its own line under the button, the logos below it,
// both starting on the headline's left edge (x = 76).
const X0 = 76, LABEL_Y = 790, ROW_Y = 828;

// A: names, in the film's own tile + name style. Two rows under the label, two pages of eight: page 1 is
// the film's four (in their original timing) with the client's first four under them; then each slot
// hands over to the next client, and page 2 (the other eight) holds to the end.
const ROW_PITCH = 70;
const PAGES = [ORDER.slice(0, 8), ORDER.slice(8, 16)];
const STAGGER = 4, FADE_IN = 13, FADE_OUT = 9, OUT_STAGGER = 3, ENTRY_DX = 32, EXIT_DX = 22;
const A = { enter: 1017, exit: 1100, end: 1202 };

// Final positions: four per row, flowing left to right like the original row.
function layoutRows(items) {
  return items.map((it, i) => ({ it, row: Math.floor(i / 4), w: it.offsetWidth })).map((o, i, all) => {
    const before = all.slice(o.row * 4, i);
    return { ...o, x: X0 + before.reduce((a, b) => a + b.w + STYLE.itemGap, 0), y: ROW_Y + o.row * ROW_PITCH };
  });
}

// Page 1: the original row's timing for the first four; the client's first four follow in the same rhythm.
// Page 2: a relay. Old item j has left (opacity < 0.05) EXIT_AT frames after it starts to go; new item i
// starts once every old item its path could touch has left, and never sooner than STAGGER after the one before.
const EXIT_AT = 8;
function relayStarts(oldL, newL, x) {
  const starts = [];
  newL.forEach((n, i) => {
    let s = i ? starts[i - 1] + STAGGER : x;
    oldL.forEach((o, j) => {
      const touches = o.row === n.row && n.x < o.x + o.w && o.x - EXIT_DX < n.x + n.w + ENTRY_DX;
      if (touches) s = Math.max(s, x + OUT_STAGGER * j + EXIT_AT);
    });
    starts.push(s);
  });
  return starts;
}

function buildA() {
  const label = makeLabel('A SELECTION OF OUR CLIENTS');
  const pages = PAGES.map(p => p.map(s => makeItem(s)));
  let L = null, starts = null;
  return {
    timing() {
      L = pages.map(layoutRows);
      starts = [PAGES[0].map((_, i) => A.enter + STAGGER * i), relayStarts(L[0], L[1], A.exit)];
      return starts;
    },
    frame(f) {
      if (!L) this.timing();
      // The label and page 1 settle like the original row: 32 px left and 7 px down, (1 - u)^2.2.
      const u0 = (f - 1018) / 72;
      place(label, X0 + ENTRY_DX * settle(u0), LABEL_Y - 7 * settle(u0), smooth(ramp(f, 1017, 1031)));
      L.forEach((items, p) => items.forEach((o, i) => {
        const s = starts[p][i];
        // each page settles as one block, as the original row does; its items only fade in one by one
        const u = p === 0 ? u0 : (f - starts[1][0]) / 62;
        const oIn = smooth(ramp(f, s, s + FADE_IN));
        const out = p === 0 ? A.exit + OUT_STAGGER * i : null;
        const oOut = out === null ? 1 : 1 - smooth(ramp(f, out, out + FADE_OUT));
        const dxOut = out === null ? 0 : -EXIT_DX * easeIn(ramp(f, out, out + 14));
        const op = oIn * oOut;
        place(o.it, o.x + ENTRY_DX * settle(u) + dxOut, o.y - 7 * settle(u), op);
        o.it.style.visibility = op <= 0.001 ? 'hidden' : 'visible';
      }));
    },
  };
}

// B: all sixteen at once, tiles only, in one row as wide as the old one.
// B ends where the source ends (frame 1105 is its last): the wall is whole by 1047 and the source's own
// settle carries the card to its end, so nothing is held or frozen.
const B = { end: 1106, stagger: 1, first: 1021 };
function buildB() {
  const label = makeLabel('A SELECTION OF OUR CLIENTS');
  const items = ORDER.map(s => makeItem(s, false));
  const W = 1180 - X0, gap = (W - 16 * STYLE.tile) / 15;
  return { frame(f) {
    const u0 = (f - 1018) / 72;
    const dx = 32 * settle(u0), dy = -7 * settle(u0);
    place(label, X0 + dx, LABEL_Y + dy, smooth(ramp(f, 1017, 1031)));
    items.forEach((it, k) => {
      const s = B.first + B.stagger * k;
      place(it, X0 + k * (STYLE.tile + gap) + dx, ROW_Y + dy, smooth(ramp(f, s, s + FADE_IN)));
    });
  } };
}

// Sound cues, from the same timing as the picture. A sound lands when its item is solid (95%, 11 frames
// into the fade), on the frame or later, never before.
const LAND = 11, VOICE_END = 1034;   // the voice's last word ends at 34.45 s
function cuesA(starts) {
  // the client's first four (page 1, second row) and all eight of page 2; the film's own four stay silent
  const notes = [0, 2, 4, 7, 9, 12, 14, 16];
  return [...starts[0].slice(4).map((s, i) => ({ frame: s + LAND, sound: 'pop', semitones: notes[i], note: `${PAGES[0][i + 4]} lands` })),
          ...starts[1].map((s, i) => ({ frame: s + LAND, sound: 'pop', semitones: notes[i], note: `${PAGES[1][i]} lands` }))];
}
function cuesB() {
  // a short, soft ticker on the cascade: every other tile, rising on a pentatonic scale, starting at
  // least 0.15 s after the last word
  const steps = [0, 2, 4, 7, 9, 12];
  return ORDER.map((slug, k) => ({ k, frame: B.first + B.stagger * k + LAND, note: `${slug} lands` }))
    .filter(c => c.frame >= VOICE_END + 5 && c.k % 2 === 0)
    .map((c, i) => ({ frame: c.frame, sound: 'tick', semitones: steps[Math.min(i, steps.length - 1)], note: c.note }));
}

window.setup = async (mode) => {
  stage.innerHTML = '';
  scene = { calib: buildCalib, A: buildA, B: buildB }[mode]();
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
  const out = { A: { ...A }, B: { ...B, cues: cuesB() } };
  if (mode === 'A') { const st = scene.timing(); out.A.starts = st; out.A.cues = cuesA(st); }
  return out;
};
window.frame = (f) => { scene.frame(f); };
</script>
</body>
</html>
