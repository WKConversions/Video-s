<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>GoHere end card: client row</title>
<style>
  @font-face { font-family: Nunito; font-weight: 600; src: url(fonts/nunito-latin-600-normal.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: Nunito; font-weight: 700; src: url(fonts/nunito-latin-700-normal.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: Nunito; font-weight: 800; src: url(fonts/nunito-latin-800-normal.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: Nunito; font-weight: 900; src: url(fonts/nunito-latin-900-normal.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  @font-face { font-family: 'Nunito Sans'; font-weight: 600; src: url(fonts/nunito-sans-latin-600-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Nunito Sans'; font-weight: 700; src: url(fonts/nunito-sans-latin-700-normal.woff2) format('woff2'); }
  @font-face { font-family: 'Nunito Sans'; font-weight: 800; src: url(fonts/nunito-sans-latin-800-normal.woff2) format('woff2'); }
  html, body { margin: 0; background: #fff; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #fff; }
  .abs { position: absolute; left: 0; top: 0; will-change: transform, opacity; }
  .label { white-space: nowrap; }
  .item { display: flex; align-items: center; white-space: nowrap; }
  .tile { flex: none; overflow: hidden; background: #fff; }
  .tile img { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
// The film plays at 30 fps; every time below is a frame of the whole film (frame 0 = 0.00 s).
// The original end card's row ("APPS BY" and four apps) started to appear on frame 1017.

const CLIENTS = {
  terschelling:     'Terschelling Tips',
  transavia:        'Transavia Tips',
  ciaotutti:        'Ciao Tutti',
  barcelonatips:    'BarcelonaTips',
  alicante:         'Alicante Like a Local',
  raadsheer:        'Raadsheer',
  malagatips:       'Malaga Tips',
  clubrondreizen:   'Club Rondreizen',
  sevillabymandy:   'Sevilla by Mandy',
  stouteschoenen:   'Stoute Schoenen',
  valenciatips:     'Valencia Tips',
  wereldstadgidsen: 'Wereldstadgidsen',
  vakantiexperts:   'VakantieXperts',
  honeyguide:       'Honeyguide',
  freely:           'Freely',
  bcnhacks:         'BCN Hacks',
};
// The four apps the film already showed, then the client's twelve in the order of their email.
const ORDER = ['terschelling', 'transavia', 'ciaotutti', 'barcelonatips',
  'alicante', 'raadsheer', 'malagatips', 'clubrondreizen',
  'sevillabymandy', 'stouteschoenen', 'valenciatips', 'wereldstadgidsen',
  'vakantiexperts', 'honeyguide', 'freely', 'bcnhacks'];

// Measured from the original row (frame 1105) and fitted by calibrate.mjs.
const STYLE = Object.assign({
  nameSize: 22, nameWeight: 800, nameColor: '#14142b', nameTrack: 0,
  labelSize: 20, labelWeight: 800, labelColor: '#4d4c60', labelTrack: 0.18, labelFamily: 'Nunito Sans',
  tile: 55, radius: 13, tileGap: 12.5, itemGap: 37,
  shadow: '0 4px 12px rgba(20, 24, 60, 0.2)',
  nameDy: 0, labelDy: 2,
}, window.STYLE_OVERRIDE || {});

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ramp = (f, a, b) => clamp((f - a) / (b - a));
const smooth = u => u * u * (3 - 2 * u);
// The original row's settle: a long ease-out, (1 - u)^2.2, fitted to its measured drift.
const settle = u => Math.pow(1 - clamp(u), 2.2);
const easeIn = u => u * u;

const stage = document.getElementById('stage');
function el(cls, parent = stage) { const d = document.createElement('div'); d.className = cls; parent.appendChild(d); return d; }

function makeLabel(text) {
  const d = el('abs label');
  d.textContent = text;
  Object.assign(d.style, {
    fontFamily: STYLE.labelFamily, fontWeight: STYLE.labelWeight, fontSize: STYLE.labelSize + 'px',
    letterSpacing: STYLE.labelTrack + 'em', color: STYLE.labelColor, lineHeight: '1',
  });
  return d;
}
function makeItem(slug, withName = true) {
  const d = el('abs item');
  const t = el('tile', d);
  Object.assign(t.style, { width: STYLE.tile + 'px', height: STYLE.tile + 'px', borderRadius: STYLE.radius + 'px', boxShadow: STYLE.shadow });
  const img = document.createElement('img'); img.src = `tiles/${slug}.png`; t.appendChild(img);
  if (withName) {
    const n = document.createElement('span');
    n.textContent = CLIENTS[slug];
    Object.assign(n.style, {
      marginLeft: STYLE.tileGap + 'px', fontFamily: 'Nunito', fontWeight: STYLE.nameWeight, fontSize: STYLE.nameSize + 'px',
      color: STYLE.nameColor, letterSpacing: STYLE.nameTrack + 'em', lineHeight: '1', position: 'relative', top: STYLE.nameDy + 'px',
    });
    d.appendChild(n);
  }
  return d;
}
const place = (d, x, y, o = 1) => { d.style.transform = `translate(${x}px, ${y}px)`; d.style.opacity = o; };

// ---------------------------------------------------------------- layouts
let scene = null;

// calib: the original row, rebuilt at its measured place, to fit the type and tiles to the film.
function buildCalib() {
  const label = makeLabel('APPS BY');
  const xs = { terschelling: 222, transavia: 503, ciaotutti: 756, barcelonatips: 959 };
  const items = Object.keys(xs).map(s => makeItem(s));
  return { frame() {
    place(label, 76, STYLE.labelY ?? 830 + STYLE.labelDy, 1);
    items.forEach((it, i) => place(it, Object.values(xs)[i], 813, 1));
  } };
}

// Layout shared by both versions: the label on its own line under the button, the logos below it,
// both starting on the headline's left edge (x = 76).
const X0 = 76, LABEL_Y = 790, ROW_Y = 828;

// A: the row keeps the film's style (tile + name) and pages through all sixteen, four at a time.
const PAGES = [ORDER.slice(0, 4), ORDER.slice(4, 8), ORDER.slice(8, 12), ORDER.slice(12, 16)];
// A page leaves left to right (2 frames apart) and the next one only starts 11 frames later, 4 frames
// apart: a name never appears where the one before it is still fading. The last page stays.
const A = { enter: [1017, 1087, 1156, 1225], exit: [1076, 1145, 1214, null], end: 1304 };
const STAGGER = 4, FADE_IN = 13, FADE_OUT = 9, OUT_STAGGER = 2;
// Sound: a soft pop as each new client lands (9 frames into its fade, when it reads as solid), the
// four of a page rising a scale; the last page resolves to the octave. The first page is the film's
// own row, under the voice's last word, and stays silent as it was.
A.cues = A.enter.slice(1).flatMap((e, p) => [0, 1, 2, 3].map(k => ({
  frame: e + STAGGER * k + 9, sound: 'pop', semitones: (p === 2 ? [0, 4, 7, 12] : [0, 2, 4, 7])[k],
  note: `${PAGES[p + 1][k]} lands` })));

function buildA() {
  const label = makeLabel('A SELECTION OF OUR CLIENTS');
  const pages = PAGES.map(p => p.map(s => makeItem(s)));
  return { frame(f) {
    // The label arrives with the first page, on the original row's settle (32 px left, 7 px down).
    const u0 = (f - 1018) / 72;
    place(label, X0 + 32 * settle(u0), LABEL_Y - 7 * settle(u0), smooth(ramp(f, 1017, 1031)));
    pages.forEach((items, p) => {
      const e = A.enter[p], x = A.exit[p];
      // a page's row settles from the right like the original row; it leaves to the left.
      const u = p === 0 ? u0 : (f - e) / 62;
      let cx = X0 + 32 * settle(u);
      items.forEach((it, k) => {
        const w = it.offsetWidth;
        const oIn = smooth(ramp(f, e + STAGGER * k, e + STAGGER * k + FADE_IN));
        const leaves = x !== null;
        const oOut = leaves ? 1 - smooth(ramp(f, x + OUT_STAGGER * k, x + OUT_STAGGER * k + FADE_OUT)) : 1;
        const dxOut = leaves ? -22 * easeIn(ramp(f, x + OUT_STAGGER * k, x + OUT_STAGGER * k + 14)) : 0;
        const o = oIn * oOut;
        place(it, cx + dxOut, ROW_Y - 7 * settle(u), o);
        it.style.visibility = o <= 0.001 ? 'hidden' : 'visible';
        cx += w + STYLE.itemGap;
      });
    });
  } };
}

// B: all sixteen at once, tiles only, in one row as wide as the old one.
const B = { end: 1140, stagger: 2 };
// Sound: a soft tick per tile as it lands, rising, from the third tile on (the first two land under the
// voice's last word).
B.cues = ORDER.map((slug, k) => ({ frame: 1017 + 4 + B.stagger * k + 9, sound: 'tick', semitones: +(0.6 * k).toFixed(2), note: `${slug} lands` })).slice(2);
function buildB() {
  const label = makeLabel('A SELECTION OF OUR CLIENTS');
  const items = ORDER.map(s => makeItem(s, false));
  const W = 1180 - X0, gap = (W - 16 * STYLE.tile) / 15;
  return { frame(f) {
    const u0 = (f - 1018) / 72;
    const dx = 32 * settle(u0), dy = -7 * settle(u0);
    place(label, X0 + dx, LABEL_Y + dy, smooth(ramp(f, 1017, 1031)));
    items.forEach((it, k) => {
      const s = 1017 + 4 + B.stagger * k;
      place(it, X0 + k * (STYLE.tile + gap) + dx, ROW_Y + dy, smooth(ramp(f, s, s + FADE_IN)));
    });
  } };
}

window.setup = async (mode) => {
  stage.innerHTML = '';
  scene = { calib: buildCalib, A: buildA, B: buildB }[mode]();
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
  return { A, B };
};
window.frame = (f) => { scene.frame(f); };
</script>
</body>
</html>
